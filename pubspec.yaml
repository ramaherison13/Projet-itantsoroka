name: itantsoroka
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  web: any
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  image_picker: ^1.2.3
  file_picker: 10.3.10
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  provider: ^6.1.5+1
  # ÉTAPE 4 : flutter_riverpod supprimé (migré vers ChangeNotifier)
  connectivity_plus: ^7.3.1
  fl_chart: ^1.2.0
  lucide_icons: ^0.257.0
  hive_flutter: ^1.1.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # ÉTAPE 4 : versions épinglées (plus de 'any' — évite les conflits)
  dio: ^5.7.0
  geojson_vi: ^2.2.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  geolocator: ^9.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/modules/
    - assets/images/tableaux_bord/
    - assets/images/centreRessource/
    - lib/assets/images/
    - lib/assets/images/home/
    - lib/assets/images/modules/
    - lib/assets/images/tableaux_bord/
    - lib/assets/images/centreRessource/